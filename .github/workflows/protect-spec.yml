# Rule 1 (AGENTS.md): the PRD and the owner's pedagogical source documents are
# written by the product owner only. Any pull request that changes them fails
# unless the owner has put the label `owner-approved-spec-change` on it.
#
# Since 8 October 2026 the PRD also carries every decision that used to live in
# the deviation register; that register no longer exists.

name: Protect the specification
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  spec_unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail if a requirement the owner removed comes back
        run: |
          set -euo pipefail
          # The owner removed this for good (23.9.2026, again 8.10.2026): an agent invented
          # "typing a digit creates blocks" in August 2026 from document 03's "two-way sync".
          # Document 03 stays as the owner wrote it; the PRD must never carry the requirement.
          hits=$(grep -nE 'הקלדה המייצרת לבנים|הקלדת ספרה מייצרת|כיוון שני, הקלדה|סנכרון דו-כיווני' \
            'מסמכי אפיון/07- 3.MathematiCore_PRD_v07 הסופי.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "Typing a digit never creates blocks (AGENTS.md, Rule 1). Remove the sentence above."
            exit 1
          fi
      - name: Fail if protected spec files changed without owner approval
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # -z: NUL-separated so Hebrew filenames come through intact.
          changed=$(git diff --name-only -z "$BASE" "$HEAD" | tr '\0' '\n' \
            | grep -E '^מסמכי אפיון/(מקור פדגוגי/|07- [0-9]+\.MathematiCore_PRD_v07 הסופי\.md$)' || true)
          if [ -z "$changed" ]; then
            echo "Protected spec files untouched."
            exit 0
          fi
          echo "This pull request changes protected specification files:"
          echo "$changed"
          case ",$LABELS," in
            *,owner-approved-spec-change,*)
              echo "Label owner-approved-spec-change is present — allowed."
              exit 0 ;;
          esac
          echo
          echo "AGENTS.md Rule 1: only the product owner changes the PRD or the pedagogical"
          echo "source documents. If this change is the owner's, add the label"
          echo "owner-approved-spec-change to the pull request. Otherwise revert it and"
          echo "raise the question with the owner instead (AGENTS.md Rule 2)."
          exit 1
