name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: react-ts-version/package-lock.json

      - name: Install dependencies
        working-directory: react-ts-version
        run: npm ci --legacy-peer-deps

      - name: Test
        working-directory: react-ts-version
        run: npm test

      - name: Build
        working-directory: react-ts-version
        run: npm run build

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Test functions
        working-directory: functions
        run: npm test

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATHIMATICORE }}

      # Every backend target goes out BEFORE hosting, and hosting waits for all
      # of them: Firestore rules -> RTDB rules -> Storage rules -> Functions ->
      # Hosting. The client a new build ships depends on what these deploy:
      # fields the old rules refuse (the telemetry stamps server_received_at /
      # sequence_number / device_id, PRD Module 5 §ב; the per-device
      # refusedEvents count, Module 17 §ב), and triggers and callables that
      # must exist before the client writes for them (an RTDB trigger does not
      # fire for a write made before it was deployed). Hosting first meant
      # every tablet that loaded the new build early had its telemetry refused
      # and parked until a reload -- and for good if a backend step failed.
      #
      # No continue-on-error and no "!cancelled()" on any of these steps: a
      # failed backend deploy fails the run and stops every step after it,
      # hosting included, so the old client keeps running against what is
      # live. (These steps once failed for months behind continue-on-error --
      # "Missing permissions ... iam.serviceAccounts.ActAs" -- while the run
      # reported success; a failure is now a red run with hosting held back.)
      #
      # The reverse risk remains: if hosting fails after the rules landed,
      # tablets keep the old JS, whose events the new rules refuse; they are
      # parked, never lost. Re-run the workflow, or have the teacher reload the
      # learners (forceReload), and prefer merging outside lesson hours.
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project mathimaticore --non-interactive

      - name: Deploy Realtime Database rules
        run: npx --yes firebase-tools@13 deploy --only database --project mathimaticore --non-interactive

      - name: Deploy Storage rules
        run: npx --yes firebase-tools@13 deploy --only storage --project mathimaticore --non-interactive

      - name: Deploy Cloud Functions
        run: npx --yes firebase-tools@13 deploy --only functions --project mathimaticore --non-interactive --force

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project mathimaticore --non-interactive
