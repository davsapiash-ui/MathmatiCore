name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: react-ts-version/package-lock.json

      - name: Install dependencies
        working-directory: react-ts-version
        run: npm ci --legacy-peer-deps

      - name: Test
        working-directory: react-ts-version
        run: npm test

      - name: Build
        working-directory: react-ts-version
        run: npm run build

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATHIMATICORE }}

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project mathimaticore --non-interactive

      # No continue-on-error here. This step had been failing in ~3 seconds on
      # every merge for months — "Missing permissions required for functions
      # deploy… iam.serviceAccounts.ActAs" — while the workflow still reported
      # success, so no Cloud Function or security rule ever reached production
      # and nothing surfaced it. A failed backend deploy must fail the run.
      # Split per target, and each one runs even after an earlier target failed
      # ("!cancelled()" rather than continue-on-error: a failure still fails the
      # run, it just no longer skips the steps behind it). The combined command
      # aborted on its first failing target, so a single missing permission kept
      # every rule set and every function on the ground -- and merely splitting
      # the steps was not enough, because a failed step still skips the rest by
      # default. Every target now reports its own verdict in one run, which is
      # what makes the remaining permission gaps legible instead of hidden
      # behind whichever one happens to run first.
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project mathimaticore --non-interactive

      - name: Deploy Storage rules
        if: '!cancelled()'
        run: npx --yes firebase-tools@13 deploy --only storage --project mathimaticore --non-interactive

      - name: Deploy Cloud Functions
        if: '!cancelled()'
        run: npx --yes firebase-tools@13 deploy --only functions --project mathimaticore --non-interactive

      - name: Deploy Realtime Database rules
        if: '!cancelled()'
        run: npx --yes firebase-tools@13 deploy --only database --project mathimaticore --non-interactive

