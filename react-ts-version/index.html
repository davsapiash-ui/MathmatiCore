<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="מתמטיקאור (MathematicOr) היא פלטפורמה דיגיטלית מתקדמת ללמידה וחקר של המבנה העשרוני ופעולות החשבון לכיתה ג'. מותאמת אישית ללמידה עצמאית, למידה מוכוונת עצמית (SRL) והוראה מכילה לחינוך המיוחד." />
    <title>מתמטיקאור | מאירים את הדרך להצלחה</title>
    <script>
      // Automatic Service Worker & Cache Storage purging to guarantee fresh assets on every deploy
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if (window.caches) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) { caches.delete(key); });
        });
      }
      if (!sessionStorage.getItem('mc_deploy_v5_flush')) {
        sessionStorage.setItem('mc_deploy_v5_flush', 'true');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
